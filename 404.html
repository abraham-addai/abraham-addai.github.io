<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Addai Yeboah Abraham</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="/">Addai Yeboah Abraham</a>
      </div>
    </header>

    <main id="main">
      <section class="section hero" aria-labelledby="nf-title">
        <div class="container stack">
          <p class="eyebrow">404</p>
          <h1 id="nf-title">Page not found</h1>
          <p class="lead">This page does not exist or has moved.</p>
          <div class="cluster hero__actions">
            <a class="btn btn--primary" href="/">Go to the home page</a>
            <a class="btn" href="/#projects">See projects</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
