<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abraham | Flutter Developer</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="#top">Abraham</a>
      </div>
    </header>

    <main id="main">
      <section id="top" class="section hero" aria-labelledby="hero-title">
        <div class="container">
          <h1 id="hero-title">Abraham</h1>
          <p class="lead">Flutter Developer</p>
        </div>
      </section>

      <section id="projects" class="section" aria-labelledby="projects-title">
        <div class="container">
          <h2 id="projects-title">Projects</h2>
        </div>
      </section>

      <section
        id="experience"
        class="section"
        aria-labelledby="experience-title"
      >
        <div class="container">
          <h2 id="experience-title">Experience</h2>
        </div>
      </section>

      <section id="skills" class="section" aria-labelledby="skills-title">
        <div class="container">
          <h2 id="skills-title">Skills</h2>
        </div>
      </section>

      <section id="contact" class="section" aria-labelledby="contact-title">
        <div class="container">
          <h2 id="contact-title">Contact</h2>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="muted">Built with plain HTML, CSS and JS.</p>
      </div>
    </footer>
  </body>
</html>
